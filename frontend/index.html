<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: extend under the iPhone notch/home bar so the
         app's env(safe-area-inset-*) padding takes over. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14a394" />
    <title>Concord</title>
    <!-- Same Concord mark as public/favicon.svg (data URI = zero extra fetch);
         keep the two in lockstep. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314a394'/%3E%3Cpath fill='white' fill-rule='evenodd' transform='translate(3.97 4.67) scale(0.876)' d='M32 6C31.1 6 30.6 6.7 30.6 8.2L30.2 17C27.3 17.8 25.2 20.5 25.2 23.8L25.2 27.6L4.6 41.6C3.4 42.4 4.1 44.3 5.5 44L24 40.7C24.7 41.9 25.8 42.8 27.1 43.3L26.2 50.6C26.1 51.6 26.9 52.2 27.7 51.7L30.3 45.9L31 55.2C31 56 31.4 56.4 32 56.4C32.6 56.4 33 56 33 55.2L33.7 45.9L36.3 51.7C37.1 52.2 37.9 51.6 37.8 50.6L36.9 43.3C38.2 42.8 39.3 41.9 40 40.7L58.5 44C59.9 44.3 60.6 42.4 59.4 41.6L38.8 27.6L38.8 23.8C38.8 20.5 36.7 17.8 33.8 17L33.4 8.2C33.4 6.7 32.9 6 32 6ZM28.4 22.3L31 22.3L31 27.2L27.4 27.2L27.4 24.3C27.4 23.3 27.7 22.3 28.4 22.3ZM33 22.3L35.6 22.3C36.3 22.3 36.6 23.3 36.6 24.3L36.6 27.2L33 27.2Z'/%3E%3C/svg%3E"
    />
    <!-- Bundled typefaces (scripts/prep-fonts.mjs). Served from this app's own
         origin, never a font host: asking one for a file on every launch would
         tell it your IP and the moment you opened Concord. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <!-- PWA: installable from the browser (Add to Home Screen on iOS). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Concord" />
    <!-- black-translucent: content draws under the iOS status bar; the mobile
         shell already pads with env(safe-area-inset-top). -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <!-- Painted by the WebView the moment the document parses, and replaced when
         Svelte mounts into #app. On mobile that gap covers the whole Go core
         boot (identity, MLS store, libp2p host) — seconds of black window on a
         cold start, and again after every sign-out, which reloads the page.
         Inline, because a stylesheet that hasn't loaded can't help here. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #16181c;
      }
      #boot svg {
        width: 68px;
        height: 68px;
        color: #14a394;
        animation: boot-bob 1.8s ease-in-out infinite;
      }
      @keyframes boot-bob {
        0%,
        100% {
          transform: translateY(3px);
          opacity: 0.75;
        }
        50% {
          transform: translateY(-5px);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="currentColor" aria-hidden="true">
          <path
            fill-rule="evenodd"
            transform="translate(3.97 4.67) scale(0.876)"
            d="M32 6C31.1 6 30.6 6.7 30.6 8.2L30.2 17C27.3 17.8 25.2 20.5 25.2 23.8L25.2 27.6L4.6 41.6C3.4 42.4 4.1 44.3 5.5 44L24 40.7C24.7 41.9 25.8 42.8 27.1 43.3L26.2 50.6C26.1 51.6 26.9 52.2 27.7 51.7L30.3 45.9L31 55.2C31 56 31.4 56.4 32 56.4C32.6 56.4 33 56 33 55.2L33.7 45.9L36.3 51.7C37.1 52.2 37.9 51.6 37.8 50.6L36.9 43.3C38.2 42.8 39.3 41.9 40 40.7L58.5 44C59.9 44.3 60.6 42.4 59.4 41.6L38.8 27.6L38.8 23.8C38.8 20.5 36.7 17.8 33.8 17L33.4 8.2C33.4 6.7 32.9 6 32 6ZM28.4 22.3L31 22.3L31 27.2L27.4 27.2L27.4 24.3C27.4 23.3 27.7 22.3 28.4 22.3ZM33 22.3L35.6 22.3C36.3 22.3 36.6 23.3 36.6 24.3L36.6 27.2L33 27.2Z"
          />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
