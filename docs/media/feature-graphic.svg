<?xml version="1.0" encoding="UTF-8"?>
<!--
  Google Play feature graphic, 1024x500.

  Built from the site's own palette (docs/index.html) and the same delta-wing
  mark the app, the README banner and the favicon use, so a listing card and the
  front page read as one thing rather than two designs of the same name.

  Rendered with:
    rsvg-convert -w 1024 -h 500 docs/media/feature-graphic.svg -o docs/media/feature-graphic.png

  Text is set in Adwaita Sans, which is an Inter derivative and therefore the
  closest thing on a plain Linux box to the site's own face. If it is missing,
  the fallback chain lands on DejaVu Sans and the graphic still renders — check
  it before shipping, because the tracking is tuned for the first one.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <radialGradient id="glow" cx="0.17" cy="-0.06" r="0.78">
      <stop offset="0%" stop-color="#14a394" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#14a394" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#14a394" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.92" cy="1.05" r="0.62">
      <stop offset="0%" stop-color="#4f7cff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#4f7cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#1f242a"/>
      <stop offset="100%" stop-color="#141619"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14a394" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#14a394" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="#16181c"/>
  <rect width="1024" height="500" fill="url(#glow)"/>
  <rect width="1024" height="500" fill="url(#glow2)"/>

  <!-- Contour lines: a cartographic hint, kept at the very edge of visible so
       it reads as texture on a phone-sized card rather than decoration. -->
  <g stroke="#e8ebee" stroke-opacity="0.055" stroke-width="1.4" fill="none">
    <path d="M660 500 C 700 400, 780 372, 872 372 C 946 372, 1010 396, 1024 424"/>
    <path d="M636 500 C 682 376, 774 340, 878 340 C 952 340, 1012 366, 1024 396"/>
    <path d="M612 500 C 664 352, 768 308, 884 308 C 956 308, 1012 336, 1024 368"/>
    <path d="M588 500 C 646 328, 762 276, 890 276 C 960 276, 1014 306, 1024 340"/>
    <path d="M564 500 C 628 304, 756 244, 896 244 C 964 244, 1016 276, 1024 312"/>
    <path d="M540 500 C 610 280, 750 212, 902 212 C 968 212, 1018 246, 1024 284"/>
  </g>

  <!-- The mark, in the same rounded tile the site's hero uses. -->
  <g transform="translate(150 172)">
    <rect width="156" height="156" rx="39" fill="url(#tile)"
          stroke="#14a394" stroke-opacity="0.34" stroke-width="1.5"/>
    <g transform="translate(29 29) scale(1.53)" fill="#e8ebee">
      <path fill-rule="evenodd" d="M32 6C31.1 6 30.6 6.7 30.6 8.2L30.2 17C27.3 17.8 25.2 20.5 25.2 23.8L25.2 27.6L4.6 41.6C3.4 42.4 4.1 44.3 5.5 44L24 40.7C24.7 41.9 25.8 42.8 27.1 43.3L26.2 50.6C26.1 51.6 26.9 52.2 27.7 51.7L30.3 45.9L31 55.2C31 56 31.4 56.4 32 56.4C32.6 56.4 33 56 33 55.2L33.7 45.9L36.3 51.7C37.1 52.2 37.9 51.6 37.8 50.6L36.9 43.3C38.2 42.8 39.3 41.9 40 40.7L58.5 44C59.9 44.3 60.6 42.4 59.4 41.6L38.8 27.6L38.8 23.8C38.8 20.5 36.7 17.8 33.8 17L33.4 8.2C33.4 6.7 32.9 6 32 6ZM28.4 22.3L31 22.3L31 27.2L27.4 27.2L27.4 24.3C27.4 23.3 27.7 22.3 28.4 22.3ZM33 22.3L35.6 22.3C36.3 22.3 36.6 23.3 36.6 24.3L36.6 27.2L33 27.2Z"/>
    </g>
  </g>

  <g font-family="Adwaita Sans, Inter, DejaVu Sans, sans-serif">
    <text x="346" y="238" fill="#e8ebee" font-size="86" font-weight="700"
          letter-spacing="-3.2">Concord</text>
    <text x="348" y="292" fill="#98a1ab" font-size="29" font-weight="400"
          letter-spacing="-0.2">Peer-to-peer, end-to-end encrypted chat</text>
    <rect x="348" y="320" width="300" height="2" fill="url(#rule)"/>
    <text x="348" y="366" fill="#14a394" font-size="24" font-weight="600"
          letter-spacing="0.1">No company · No accounts · No server in the middle</text>
  </g>
</svg>
