# fly.io deployment for Concord's rendezvous/relay node.
# Deploy from the repo root:  fly deploy -c fly.rendezvous.toml
#
# The node is untrusted infrastructure: it relays end-to-end-encrypted traffic
# and serves the DHT; it never sees plaintext or media.

app = "concord-rdv-zahak"
primary_region = "iad"

[build]
  dockerfile = "infra/rendezvous/Dockerfile"

[env]
  PORT = "4001"
  # Guest gateway (browser guests joining a meeting — see cmd/rendezvous/guest.go).
  CONCORD_GUEST_PORT = "8080"
  # TURN relay for IP-private calls (see cmd/rendezvous/turn.go). Dormant until
  # CONCORD_TURN_SECRET is set as a fly SECRET — set it to enable the relay:
  #   fly secrets set -a concord-rdv-zahak CONCORD_TURN_SECRET=$(openssl rand -hex 32)
  # Calls force-relay through TCP:3478, so only that port is exposed below; the
  # relay refuses private/loopback peers (SSRF guard). Clients that can't reach
  # the relay simply fall back to a direct call.
  CONCORD_TURN_PORT = "3478"
  # (CONCORD_PUBLIC_HOST is set as a fly SECRET on the app — not here.)

# A single always-on machine is plenty for a personal/small deployment.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# libp2p needs both TCP and UDP (QUIC) on the same port, exposed directly
# (no HTTP handler / TLS termination — this is a raw libp2p endpoint).
[[services]]
  internal_port = 4001
  protocol = "tcp"
  auto_stop_machines = false
  min_machines_running = 1
  [[services.ports]]
    port = 4001

[[services]]
  internal_port = 4001
  protocol = "udp"
  [[services.ports]]
    port = 4001

# HTTPS for the guest gateway: fly terminates TLS and forwards to :8080.
# This is the ONLY plain-web surface Concord has — it serves the guest page
# and pipes each guest's WebSocket to the meeting host. It cannot read the
# meeting (member traffic stays end-to-end encrypted).
[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  min_machines_running = 1
  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

# TURN relay: DISABLED on this host, deliberately. The design assumed the
# relay could bridge its two TCP allocations internally; measured against the
# live deployment, packets sent between two allocations on this machine are
# dropped — fly's edge does not hairpin UDP back to the advertised public IP,
# so a relay here can authenticate, allocate, and then carry nothing. Calls
# fall back to direct connection (no IP hiding) and actually work. If IP-
# private calls matter, host the relay on a machine that owns its public IP
# (any small VPS) and point CONCORD_TURN_* there; re-adding this block on fly
# without re-testing turnprobe2 will just resurrect the silent failure.
#
# [[services]]
#   internal_port = 3478
#   protocol = "tcp"
#   auto_stop_machines = false
#   min_machines_running = 1
#   [[services.ports]]
#     port = 3478
