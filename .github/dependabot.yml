# Dependency updates, batched hard.
#
# Two people maintain this, .github/CODEOWNERS requests review from both on
# every pull request, and Dependabot's first run over a repository that never
# had it opens one per outdated dependency — which was twelve pull requests and
# roughly two dozen review-request emails between them in an afternoon. A
# maintainer who mutes the notifications is worse off than one who never got
# them, so the volume is the thing to fix, not the inbox.
#
# So: one grouped pull request per ecosystem, monthly. Four a month between
# everything, each one a single review. Security advisories are pushed by GitHub
# regardless of this file and are not affected — those should interrupt.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      # Everything in one pull request. Splitting by family (libp2p, x/*, the
      # rest) sounds tidier and just means three reviews instead of one; these
      # move together often enough that a single "bump the Go deps" is the
      # honest unit of work.
      go-dependencies:
        patterns: ["*"]
    ignore:
      # Vendored under third_party/mls-go and wired in with a `replace`, so a
      # version bump here does nothing except create noise. Updating the fork is
      # a manual re-vendor — see THIRD-PARTY-NOTICES.md for the local changes
      # that have to be carried forward.
      - dependency-name: github.com/thomas-vilte/mls-go

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/mobile
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      mobile:
        patterns: ["*"]

  # Actions are pinned by commit SHA in the release workflow, which is exactly
  # the case Dependabot exists to maintain: a human will not notice a pinned
  # digest going stale.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
