# Fast feedback on every push/PR — so a bug is caught here, not in a release.
# The lint step is the important one: it fails on an undeclared reference
# (no-undef), the class of bug that once shipped a stray template variable and
# crashed the UI at runtime while the build stayed green.
name: ci

# Runs on every push and pull request: Actions minutes are free for public
# repos, so there is no reason to gate the one check that reviews a contribution
# before a human does. workflow_dispatch stays for re-running a branch by hand.
# Limiting push to main keeps a PR branch from running the suite twice (once for
# the push, once for the PR) and keeps tag pushes to the release workflow.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *" # nightly, for the integration and e2e jobs below
  workflow_dispatch:

# Read-only. Nothing here needs to write, and on a public repo `pull_request`
# runs code from forks — a token that cannot do anything is the cheapest way to
# keep that true no matter what the repository default becomes.
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: cd frontend && npm ci
      - name: Lint (no-undef gate)
        run: cd frontend && npm run lint
      - name: Build
        run: cd frontend && npm run build
      - name: Markdown/render tests
        run: cd frontend && npm test
      # The manual is published from the committed docs/manual/, so a source
      # edited without `make docs` would publish the old page. This also fails
      # on a link to a heading or file that does not exist.
      - name: Documentation site is current
        run: node scripts/build-docs.mjs --check

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      # The binary embeds frontend/dist (see main_web.go), and dist is a build
      # artifact rather than a tracked directory, so Go cannot compile at all
      # until the frontend has been built once. This job is separate from the
      # frontend one and starts from a clean checkout, so it has to build it
      # here or `go build ./...` fails on the embed with no matching files.
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: cd frontend && npm ci && npm run build
      - run: go build ./...
      - run: go vet ./...
      # Formatting used to be the one thing CI did not check, on the reasoning
      # that contributors run `make fmt`. Two files had drifted by the time
      # anyone looked. It costs a second here and it is never a judgement call,
      # so it may as well be the machine's job. third_party/ is vendored and
      # formatted upstream's way, not ours.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^third_party/' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt'd — run 'make fmt':"; echo "$unformatted"; exit 1
          fi
      # -short skips the 84 tests that stand up real libp2p nodes and wait on
      # message propagation with deadlines in the tens of seconds. Those are
      # worth running, but not as the gate on a pull request: under the race
      # detector on a shared runner they miss their deadlines often enough that
      # a red build would stop meaning anything, and a gate people learn to
      # ignore is worse than no gate. This leaves 130 tests covering the pure
      # logic, in under a minute, deterministically. The full suite runs in the
      # integration job below.
      - name: Tests (race detector)
        run: go test -race -short ./...

  # The Android app, built far enough to know it still compiles. Nothing else
  # here touches apps/mobile, so a Capacitor or plugin bump, a Java edit or a
  # change to the gomobile surface in mobile/ could break the app and still
  # pass. The core is bound for x86_64 alone, which keeps the cgo link to one
  # ABI and still runs the libc overlay that only x86 needs (make
  # android-core). A debug build is signed with the SDK's throwaway key, so no
  # secret is involved and a fork's pull request builds the same way.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21", cache: gradle }
      # Pinned by commit, as in the release workflow. (v4.0.4)
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install NDK + gomobile
        # The same NDK and the same go.mod-pinned gomobile as a release.
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          mobile_ver=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install golang.org/x/mobile/cmd/gomobile@"$mobile_ver"
          go install golang.org/x/mobile/cmd/gobind@"$mobile_ver"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # Capacitor copies frontend/dist into the app's assets on sync.
      - run: cd frontend && npm ci && npm run build
      - name: Go core (x86_64 only)
        run: make android-core ANDROID_TARGET=android/amd64
      - name: Capacitor sync
        run: cd apps/mobile && npm ci && npx cap sync android
      - name: Gradle debug build
        run: cd apps/mobile/android && ./gradlew --no-daemon assembleDebug -PconcordAbi=x86_64

  # The network integration suite: every test the gate above skips. Scheduled
  # rather than blocking, because it drives multi-node message propagation and
  # is inherently timing-sensitive. -p 1 keeps packages from competing for the
  # CPU, which is most of the difference between it passing and not.
  integration:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: cd frontend && npm ci && npm run build
      - name: Full suite (race detector, serialised)
        run: go test -race -p 1 -timeout 30m ./...

  # The browser end-to-end suite: real peers, a local rendezvous and headless
  # Chromium. Nightly and on demand like the integration job, and for the same
  # reason: it waits on real message propagation, which a shared runner makes
  # too slow to hold a pull request to. The timeout scale is that allowance.
  e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: cd frontend && npm ci
      # playwright-core is not a project dependency (scripts/playwright.mjs
      # says why), so the job borrows an install the same way a contributor
      # does, and lets it fetch the one browser it drives.
      - name: Borrow playwright-core and its Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" playwright-core
          npx --prefix "$RUNNER_TEMP/pw" playwright-core install --with-deps chromium
          echo "PLAYWRIGHT_CORE=$RUNNER_TEMP/pw/node_modules/playwright-core" >> "$GITHUB_ENV"
      - name: End-to-end suite
        run: make e2e
        env:
          E2E_TIMEOUT_SCALE: "2"
      - name: Keep what a failure left behind
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: .dev/e2e/**/artifacts
          if-no-files-found: ignore
