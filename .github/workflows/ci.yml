# Fast feedback on every push/PR — so a bug is caught here, not in a release.
# The lint step is the important one: it fails on an undeclared reference
# (no-undef), the class of bug that once shipped a stray template variable and
# crashed the UI at runtime while the build stayed green.
name: ci

# MANUAL ONLY (workflow_dispatch). GitHub Actions billing is disabled on this
# private repo, so a push/PR-triggered run just fails in ~5s on the payment
# error and emails a failure — pure noise, no signal. The real check runs
# locally before every release: `go build ./... && go test ./...` and
# `cd frontend && npm run build && node --test src/lib/*.test.mjs`. Re-enable
# the push/pull_request triggers here if Actions billing is ever restored.
on:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd frontend && npm ci
      - name: Lint (no-undef gate)
        run: cd frontend && npm run lint
      - name: Build
        run: cd frontend && npm run build
      - name: Markdown/render tests
        run: cd frontend && npm test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go build ./...
      - run: go vet ./...
      - name: Tests (race detector)
        run: go test -race ./...
