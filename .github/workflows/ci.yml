# Fast feedback on every push/PR — so a bug is caught here, not in a release.
# The lint step is the important one: it fails on an undeclared reference
# (no-undef), the class of bug that once shipped a stray template variable and
# crashed the UI at runtime while the build stayed green.
name: ci

# Runs on every push and pull request: Actions minutes are free for public
# repos, so there is no reason to gate the one check that reviews a contribution
# before a human does. workflow_dispatch stays for re-running a branch by hand.
# Limiting push to main keeps a PR branch from running the suite twice (once for
# the push, once for the PR) and keeps tag pushes to the release workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd frontend && npm ci
      - name: Lint (no-undef gate)
        run: cd frontend && npm run lint
      - name: Build
        run: cd frontend && npm run build
      - name: Markdown/render tests
        run: cd frontend && npm test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      # The binary embeds frontend/dist (see main_web.go), and dist is a build
      # artifact rather than a tracked directory, so Go cannot compile at all
      # until the frontend has been built once. This job is separate from the
      # frontend one and starts from a clean checkout, so it has to build it
      # here or `go build ./...` fails on the embed with no matching files.
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd frontend && npm ci && npm run build
      - run: go build ./...
      - run: go vet ./...
      # -p 1 runs one package at a time. Several tests here stand up real
      # libp2p nodes and wait on them with deadlines in the tens of seconds;
      # with packages running concurrently under the race detector they lose
      # the CPU long enough to blow those deadlines and fail for reasons that
      # have nothing to do with the change under test. Serialising costs a
      # couple of minutes of wall clock and buys a green build that means
      # something.
      - name: Tests (race detector)
        run: go test -race -p 1 ./...
