# Dual-track release: the zero-dependency web binaries (one per OS, browser
# shell) AND the branded native desktop apps (real window + Concorde icon).
# The web track cross-compiles from Linux; the native track needs each OS's
# WebView, so it runs on a per-OS matrix.
#
# Both tracks upload their outputs as workflow artifacts, then a final `publish`
# job gathers everything and attaches it to the GitHub Release for the tag.
name: release

# MANUAL ONLY (workflow_dispatch), run from the tag you want to release — the
# publish job checks for a tag ref and does nothing without one. Tag pushes do
# not trigger it: the default release path is local (scripts/publish-release.sh
# builds the web binaries plus whatever native artifacts the machine can produce
# and uploads them with `gh`), and a maintainer should decide deliberately when
# to spend a full cross-OS matrix — the macOS jobs alone take ~40 minutes.
on:
  workflow_dispatch:

# The publish job needs write access to create/update the Release.
permissions:
  contents: write

jobs:
  # Frontend lint gate: catches "referenced something that doesn't exist"
  # (no-undef) — the class of bug that let a stray template variable ship and
  # crash the UI at runtime while the build stayed green. Builds wait on it.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: cd frontend && npm ci && npm run lint

  # Zero-dependency web binaries — the "download one file, it just runs" track.
  web:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      # Stamp the git tag into the binary (internal/version.Version) for the update check.
      - run: make release VERSION=${{ github.ref_name }}
      - uses: actions/upload-artifact@v7
        with:
          name: concord-web-binaries
          path: dist-release/*

  # Branded native desktop apps via Wails (cgo + system WebView per OS).
  native:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, out: concord-desktop-linux }
          - { os: macos-latest, out: concord-desktop-macos }
          - { os: windows-latest, out: concord-desktop-windows }
    runs-on: ${{ matrix.os }}
    # Wails builds are ~2-6 min; cap well above that so a hang fails fast (25 min)
    # instead of holding a runner for the 6-hour default.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - name: Linux WebView deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      # Keep this in step with the wails LIBRARY version in go.mod. Nothing
      # enforces it and no test catches a mismatch: CI never runs `wails build`,
      # so a Dependabot bump of the library sails through green while this line
      # still installs the old CLI. Verified locally against v2.13.0 with the
      # exact flags below before bumping.
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Build frontend
        run: cd frontend && npm ci && npm run build
      # `wails build` emits a raw binary (Linux), a .app bundle (macOS), or an
      # .exe (Windows) into build/bin/, all carrying the embedded Concorde icon.
      #
      # -skipbindings is REQUIRED: Wails v2.12.0's JS-binding *generator*
      # (wailsbindings) deadlocks under Go 1.26, hanging the whole build. We
      # don't use the generated files anyway — the frontend calls the runtime-
      # injected window.go.main.App.* directly (see frontend/src/lib/api.js), so
      # skipping generation is safe and the bound methods still work at runtime.
      # The `wails` tag is REQUIRED: main_wails.go is behind //go:build wails and
      # main_web.go behind //go:build !wails. Without it, `wails build` compiles
      # the browser-served web variant instead of the native desktop app — the
      # binary silently starts a localhost web server instead of opening a window
      # (matches Makefile's gui-dev: -tags "wails webkit2_41").
      # Stamp the Windows version resource (Properties → Details) from the tag.
      # ProductVersion must be numeric (no "v"); only on tag builds so a manual
      # workflow_dispatch keeps the valid static value in wails.json.
      - name: Stamp Windows version resource
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v',''
          (Get-Content wails.json -Raw) -replace '"productVersion": "[^"]*"', ('"productVersion": "' + $v + '"') | Set-Content wails.json
          Write-Host "productVersion -> $v"
      # -ldflags stamps internal/version.Version (the tag) into the binary for the update
      # check. Wails still adds -w -s in production; that's fine — the version
      # string survives stripping.
      - name: Build native app
        run: wails build -tags "wails webkit2_41" -skipbindings -ldflags "-X github.com/ZahakJ/concord/internal/version.Version=${{ github.ref_name }}"

      # Name each output per-OS so it's a direct download and doesn't collide
      # with the web track (which also emits a concord-windows.exe). Windows and
      # Linux ship as a bare double-click executable; macOS's .app is a directory
      # bundle, so it MUST be zipped to travel as one file.
      # The tag is stamped into each filename (e.g. concord-desktop-windows-
      # v0.6.0.exe) so downloaded builds are visibly different across releases.
      # The updater matches assets by OS keyword, so the version suffix is fine.
      - name: Package (Linux — bare binary)
        if: matrix.os == 'ubuntu-latest'
        run: |
          bin=$(find build/bin -maxdepth 1 -type f | head -1)
          echo "packaging $bin"
          cp "$bin" ${{ matrix.out }}-${{ github.ref_name }}
      - name: Package (Windows — bare .exe)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $exe = Get-ChildItem build/bin -Filter *.exe | Select-Object -First 1
          Write-Host "packaging $($exe.FullName)"
          Copy-Item $exe.FullName ${{ matrix.out }}-${{ github.ref_name }}.exe
      - name: Package (macOS — zip the .app bundle)
        if: matrix.os == 'macos-latest'
        run: |
          cd build/bin
          zip -r -q ../../${{ matrix.out }}-${{ github.ref_name }}.zip *.app

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.out }}
          # Matches concord-desktop-linux, concord-desktop-windows.exe, or
          # concord-desktop-macos.zip depending on the OS.
          path: ${{ matrix.out }}*

  # Android app bundle (.aab) via gomobile + Gradle. Builds the shared Go core
  # into an .aar, then the Capacitor project into a release bundle. Signs it when
  # an upload keystore secret is present; otherwise emits the unsigned bundle so
  # the build still validates on every tag. Play upload stays manual for now.
  mobile-android:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      # Third-party actions are pinned by commit, not by tag: a tag is mutable,
      # and this job holds the signing keystore. (v3)
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      - name: Install NDK + gomobile
        # gomobile/gobind are pinned to the golang.org/x/mobile revision in
        # go.mod. They were @latest, which is the one unpinned input in a
        # release build where the NDK, Wails and goversioninfo are all fixed —
        # so the artifact depended on whatever upstream had merged that morning.
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          mobile_ver=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          echo "pinning gomobile to $mobile_ver"
          go install golang.org/x/mobile/cmd/gomobile@"$mobile_ver"
          go install golang.org/x/mobile/cmd/gobind@"$mobile_ver"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Decode signing keystore
        if: env.ANDROID_KEYSTORE_B64 != ''
        # keystore.properties is what app/build.gradle reads (gitignored; local
        # builds keep their own copy). storeFile resolves relative to app/.
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > apps/mobile/android/upload.keystore
          cat > apps/mobile/android/keystore.properties <<EOF
          storeFile=../upload.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=concord
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          EOF
      # Reuses the Makefile target (frontend -> android-core -> cap sync -> gradle),
      # so local and CI builds stay identical. VERSION stamps the Go core.
      #
      # versionCode is derived from the tag rather than the run number: Play
      # only ever accepts a code strictly greater than the last upload, and a
      # run number resets meaning the moment the workflow is edited. minor*100
      # + patch matches what the published builds already carry (v0.57.0 is
      # 5700) and leaves 99 patch releases per minor.
      - name: Build app bundle
        run: |
          v=${GITHUB_REF_NAME#v}
          minor=$(echo "$v" | cut -d. -f2)
          patch=$(echo "$v" | cut -d. -f3)
          code=$(( 10#$minor * 100 + 10#$patch ))
          echo "versionCode $code from tag $GITHUB_REF_NAME"
          make android-app VERSION="$GITHUB_REF_NAME" MOBILE_VERSION_CODE="$code"
      - uses: actions/upload-artifact@v7
        with:
          name: concord-android
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
      # The sideloadable APK ships as a GitHub Release download (unlike the
      # .aab) — separate artifact so the publish job can include just it.
      - uses: actions/upload-artifact@v7
        with:
          name: concord-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/concord-*-android.apk

  # iOS archive via gomobile + Xcode on a macOS runner. Produces the .xcarchive;
  # exporting a signed .ipa / TestFlight upload needs an Apple Developer account
  # and provisioning, wired via secrets when available (kept manual until then).
  mobile-ios:
    needs: lint
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - name: Install gomobile
        # Pinned to go.mod's x/mobile revision — see the Android job.
        run: |
          mobile_ver=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install golang.org/x/mobile/cmd/gomobile@"$mobile_ver"
          go install golang.org/x/mobile/cmd/gobind@"$mobile_ver"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build iOS core (xcframework)
        run: make ios-core VERSION=${{ github.ref_name }}
      # Archive without signing here (no secrets required to validate the build);
      # a signed export/TestFlight step is added once the Apple account is set up.
      - name: Build + archive app
        run: |
          cd frontend && npm ci && npm run build && cd ..
          cd apps/mobile && npm ci && npx cap sync ios
          # SPM-based Capacitor project (CapApp-SPM): no CocoaPods workspace,
          # the .xcodeproj is the build entry point.
          cd ios/App && xcodebuild -project App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v7
        with:
          name: concord-ios-archive
          path: apps/mobile/ios/App/build/App.xcarchive

  # Gather every artifact and attach it to the tag's GitHub Release.
  publish:
    # mobile-android is in needs so its APK artifact exists before download;
    # the `if` below still only requires the web track to have succeeded, so a
    # failed mobile build never blocks the desktop release.
    needs: [web, native, mobile-android]
    runs-on: ubuntu-latest
    # Publish as long as the web track succeeded and this is a tag push — even if
    # a desktop build fails/times out. That way the "download and run" web
    # binaries always reach the Release; the desktop apps attach when they build.
    if: always() && needs.web.result == 'success' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Flatten artifact tree
        # Store-track artifacts (.aab / .xcarchive) stay workflow-only; the
        # sideloadable APK (concord-android-apk) IS a Release download so
        # friends can install directly from the release page.
        # WINDOWS.md is copied IN rather than attached separately, so it is
        # covered by SHA256SUMS like every other asset — matching what
        # scripts/publish-release.sh does locally.
        run: |
          mkdir -p release-assets
          find artifacts -type f \
            -not -path '*/concord-android/*' \
            -not -path '*/concord-ios-archive/*' \
            -exec cp {} release-assets/ \;
          cp WINDOWS.md release-assets/
          echo "Release assets:" && ls -lh release-assets/
      - name: Generate SHA256SUMS
        # Excludes the manifest itself explicitly rather than relying on glob
        # expansion happening before the redirect truncates it.
        run: cd release-assets && sha256sum $(ls | grep -v '^SHA256SUMS$') > SHA256SUMS && cat SHA256SUMS
      # The signing key is deliberately OFFLINE (cmd/releasekey): the ordinary
      # release path is scripts/publish-release.sh on a maintainer's machine,
      # which signs there and never lets the key near a runner.
      #
      # This matters more than it looks. internal/bridge/release-pubkey.txt is
      # populated, so every build enforces signatures — a release published with
      # a SHA256SUMS and no SHA256SUMS.sig is one that every existing install
      # REFUSES to update to (verifyWithKey -> errUnsignedRelease). Publishing
      # unsigned is therefore not "slightly weaker", it is broken.
      #
      # So: sign if a key is configured, and otherwise publish a DRAFT — which
      # the maintainer can see and finish locally, and which the updater (it
      # asks for the latest PUBLISHED release) never sees.
      - name: Sign the manifest
        id: sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::warning::No RELEASE_SIGNING_KEY secret — publishing a DRAFT. Sign SHA256SUMS locally ('go run ./cmd/releasekey sign') and publish the draft, or existing installs will refuse this release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release.key"
          CONCORD_RELEASE_KEY="$RUNNER_TEMP/release.key" \
            go run ./cmd/releasekey sign release-assets/SHA256SUMS
          rm -f "$RUNNER_TEMP/release.key"
          test -s release-assets/SHA256SUMS.sig
          echo "signed=true" >> "$GITHUB_OUTPUT"
      # Publishes to this repo's own Releases, which is also what the in-app
      # update check polls (internal/bridge/update.go). The default GITHUB_TOKEN
      # with `permissions: contents: write` is enough — no personal access token
      # is involved, so a fork's release works with no secrets configured.
      - name: Publish GitHub Release
        # Pinned by commit (v2): this step runs with contents: write.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: release-assets/*
          fail_on_unmatched_files: false
          generate_release_notes: true
          # Unsigned means draft. See the signing step above for why.
          draft: ${{ steps.sign.outputs.signed != 'true' }}
