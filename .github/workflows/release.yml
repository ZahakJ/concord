# Dual-track release: the zero-dependency web binaries (one per OS, browser
# shell) AND the branded native desktop apps (real window + Concorde icon).
# Triggered on a version tag. The web track cross-compiles from Linux; the
# native track needs each OS's WebView, so it runs on a per-OS matrix.
#
# Both tracks upload their outputs as workflow artifacts, then a final `publish`
# job gathers everything and attaches it to the GitHub Release for the tag — so
# a push of `vX.Y.Z` produces a complete release with no manual `gh release
# upload` afterward.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The publish job needs write access to create/update the Release.
permissions:
  contents: write

jobs:
  # Zero-dependency web binaries — the "download one file, it just runs" track.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: concord-web-binaries
          path: dist-release/*

  # Branded native desktop apps via Wails (cgo + system WebView per OS).
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, out: concord-desktop-linux }
          - { os: macos-latest, out: concord-desktop-macos }
          - { os: windows-latest, out: concord-desktop-windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Linux WebView deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Build frontend
        run: cd frontend && npm ci && npm run build
      # `wails build` emits a raw binary (Linux), a .app bundle (macOS), or an
      # .exe (Windows) into build/bin/, all carrying the embedded Concorde icon.
      - name: Build native app
        run: wails build -tags webkit2_41

      # Name each output per-OS so it's a direct download and doesn't collide
      # with the web track (which also emits a concord-windows.exe). Windows and
      # Linux ship as a bare double-click executable; macOS's .app is a directory
      # bundle, so it MUST be zipped to travel as one file.
      - name: Package (Linux — bare binary)
        if: matrix.os == 'ubuntu-latest'
        run: |
          bin=$(find build/bin -maxdepth 1 -type f | head -1)
          echo "packaging $bin"
          cp "$bin" ${{ matrix.out }}
      - name: Package (Windows — bare .exe)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $exe = Get-ChildItem build/bin -Filter *.exe | Select-Object -First 1
          Write-Host "packaging $($exe.FullName)"
          Copy-Item $exe.FullName ${{ matrix.out }}.exe
      - name: Package (macOS — zip the .app bundle)
        if: matrix.os == 'macos-latest'
        run: |
          cd build/bin
          zip -r -q ../../${{ matrix.out }}.zip *.app

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          # Matches concord-desktop-linux, concord-desktop-windows.exe, or
          # concord-desktop-macos.zip depending on the OS.
          path: ${{ matrix.out }}*

  # Gather every artifact and attach it to the tag's GitHub Release.
  publish:
    needs: [web, native]
    runs-on: ubuntu-latest
    # Only publish for real tag pushes, not manual workflow_dispatch runs.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifact tree
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          echo "Release assets:" && ls -lh release-assets/
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
            WINDOWS.md
          fail_on_unmatched_files: false
          generate_release_notes: true
