# Dual-track release: the zero-dependency web binaries (one per OS, browser
# shell) AND the branded native desktop apps (real window + Concorde icon).
# Triggered on a version tag. The web track cross-compiles from Linux; the
# native track needs each OS's WebView, so it runs on a per-OS matrix.
#
# Both tracks upload their outputs as workflow artifacts, then a final `publish`
# job gathers everything and attaches it to the GitHub Release for the tag — so
# a push of `vX.Y.Z` produces a complete release with no manual `gh release
# upload` afterward.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The publish job needs write access to create/update the Release.
permissions:
  contents: write

jobs:
  # Frontend lint gate: catches "referenced something that doesn't exist"
  # (no-undef) — the class of bug that let a stray template variable ship and
  # crash the UI at runtime while the build stayed green. Builds wait on it.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd frontend && npm ci && npm run lint

  # Zero-dependency web binaries — the "download one file, it just runs" track.
  web:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # Stamp the git tag into the binary (internal/version.Version) for the update check.
      - run: make release VERSION=${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: concord-web-binaries
          path: dist-release/*

  # Branded native desktop apps via Wails (cgo + system WebView per OS).
  native:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, out: concord-desktop-linux }
          - { os: macos-latest, out: concord-desktop-macos }
          - { os: windows-latest, out: concord-desktop-windows }
    runs-on: ${{ matrix.os }}
    # Wails builds are ~2-6 min; cap well above that so a hang fails fast (25 min)
    # instead of holding a runner for the 6-hour default.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Linux WebView deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Build frontend
        run: cd frontend && npm ci && npm run build
      # `wails build` emits a raw binary (Linux), a .app bundle (macOS), or an
      # .exe (Windows) into build/bin/, all carrying the embedded Concorde icon.
      #
      # -skipbindings is REQUIRED: Wails v2.12.0's JS-binding *generator*
      # (wailsbindings) deadlocks under Go 1.26, hanging the whole build. We
      # don't use the generated files anyway — the frontend calls the runtime-
      # injected window.go.main.App.* directly (see frontend/src/lib/api.js), so
      # skipping generation is safe and the bound methods still work at runtime.
      # The `wails` tag is REQUIRED: main_wails.go is behind //go:build wails and
      # main_web.go behind //go:build !wails. Without it, `wails build` compiles
      # the browser-served web variant instead of the native desktop app — the
      # binary silently starts a localhost web server instead of opening a window
      # (matches Makefile's gui-dev: -tags "wails webkit2_41").
      # Stamp the Windows version resource (Properties → Details) from the tag.
      # ProductVersion must be numeric (no "v"); only on tag builds so a manual
      # workflow_dispatch keeps the valid static value in wails.json.
      - name: Stamp Windows version resource
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v',''
          (Get-Content wails.json -Raw) -replace '"productVersion": "[^"]*"', ('"productVersion": "' + $v + '"') | Set-Content wails.json
          Write-Host "productVersion -> $v"
      # -ldflags stamps internal/version.Version (the tag) into the binary for the update
      # check. Wails still adds -w -s in production; that's fine — the version
      # string survives stripping.
      - name: Build native app
        run: wails build -tags "wails webkit2_41" -skipbindings -ldflags "-X github.com/zahak/concord/internal/version.Version=${{ github.ref_name }}"

      # Name each output per-OS so it's a direct download and doesn't collide
      # with the web track (which also emits a concord-windows.exe). Windows and
      # Linux ship as a bare double-click executable; macOS's .app is a directory
      # bundle, so it MUST be zipped to travel as one file.
      # The tag is stamped into each filename (e.g. concord-desktop-windows-
      # v0.6.0.exe) so downloaded builds are visibly different across releases.
      # The updater matches assets by OS keyword, so the version suffix is fine.
      - name: Package (Linux — bare binary)
        if: matrix.os == 'ubuntu-latest'
        run: |
          bin=$(find build/bin -maxdepth 1 -type f | head -1)
          echo "packaging $bin"
          cp "$bin" ${{ matrix.out }}-${{ github.ref_name }}
      - name: Package (Windows — bare .exe)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $exe = Get-ChildItem build/bin -Filter *.exe | Select-Object -First 1
          Write-Host "packaging $($exe.FullName)"
          Copy-Item $exe.FullName ${{ matrix.out }}-${{ github.ref_name }}.exe
      - name: Package (macOS — zip the .app bundle)
        if: matrix.os == 'macos-latest'
        run: |
          cd build/bin
          zip -r -q ../../${{ matrix.out }}-${{ github.ref_name }}.zip *.app

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          # Matches concord-desktop-linux, concord-desktop-windows.exe, or
          # concord-desktop-macos.zip depending on the OS.
          path: ${{ matrix.out }}*

  # Android app bundle (.aab) via gomobile + Gradle. Builds the shared Go core
  # into an .aar, then the Capacitor project into a release bundle. Signs it when
  # an upload keystore secret is present; otherwise emits the unsigned bundle so
  # the build still validates on every tag. Play upload stays manual for now.
  mobile-android:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
      - name: Install NDK + gomobile
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Decode signing keystore
        if: env.ANDROID_KEYSTORE_B64 != ''
        # keystore.properties is what app/build.gradle reads (gitignored; local
        # builds keep their own copy). storeFile resolves relative to app/.
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > apps/mobile/android/upload.keystore
          cat > apps/mobile/android/keystore.properties <<EOF
          storeFile=../upload.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=concord
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          EOF
      # Reuses the Makefile target (frontend -> android-core -> cap sync -> gradle),
      # so local and CI builds stay identical. VERSION stamps the Go core.
      - name: Build app bundle
        run: make android-app VERSION=${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: concord-android
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
      # The sideloadable APK ships as a GitHub Release download (unlike the
      # .aab) — separate artifact so the publish job can include just it.
      - uses: actions/upload-artifact@v4
        with:
          name: concord-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/concord-*-android.apk

  # iOS archive via gomobile + Xcode on a macOS runner. Produces the .xcarchive;
  # exporting a signed .ipa / TestFlight upload needs an Apple Developer account
  # and provisioning, wired via secrets when available (kept manual until then).
  mobile-ios:
    needs: lint
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build iOS core (xcframework)
        run: make ios-core VERSION=${{ github.ref_name }}
      # Archive without signing here (no secrets required to validate the build);
      # a signed export/TestFlight step is added once the Apple account is set up.
      - name: Build + archive app
        run: |
          cd frontend && npm ci && npm run build && cd ..
          cd apps/mobile && npm ci && npx cap sync ios
          cd ios/App && xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: concord-ios-archive
          path: apps/mobile/ios/App/build/App.xcarchive

  # Gather every artifact and attach it to the tag's GitHub Release.
  publish:
    # mobile-android is in needs so its APK artifact exists before download;
    # the `if` below still only requires the web track to have succeeded, so a
    # failed mobile build never blocks the desktop release.
    needs: [web, native, mobile-android]
    runs-on: ubuntu-latest
    # Mapped to an env var so a step `if:` can detect whether the public dist
    # repo is wired up yet (secrets can't be read directly in `if:`).
    env:
      DIST_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
    # Publish as long as the web track succeeded and this is a tag push — even if
    # a desktop build fails/times out. That way the "download and run" web
    # binaries always reach the Release; the desktop apps attach when they build.
    if: always() && needs.web.result == 'success' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifact tree
        # Store-track artifacts (.aab / .xcarchive) stay workflow-only; the
        # sideloadable APK (concord-android-apk) IS a Release download so
        # friends can install directly from the release page.
        run: |
          mkdir -p release-assets
          find artifacts -type f \
            -not -path '*/concord-android/*' \
            -not -path '*/concord-ios-archive/*' \
            -exec cp {} release-assets/ \;
          echo "Release assets:" && ls -lh release-assets/
      - name: Generate SHA256SUMS
        run: cd release-assets && sha256sum * > SHA256SUMS && cat SHA256SUMS
      # Always publish to the private source repo (archive + how you distribute
      # today). Uses the default GITHUB_TOKEN via `permissions: contents: write`.
      - name: Publish GitHub Release (private repo)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
            WINDOWS.md
          fail_on_unmatched_files: false
          generate_release_notes: true
      # ALSO publish to the SEPARATE PUBLIC dist repo — but only once it's wired
      # up. The app polls concord-dist's releases unauthenticated for updates, so
      # the source repo can stay private. Until DIST_REPO_TOKEN (a fine-grained
      # PAT scoped to contents:write on ZahakJ/concord-dist ONLY) is added, this
      # step is skipped and the release still succeeds to the private repo.
      # tag_name is explicit because the dist repo has no such ref.
      - name: Publish GitHub Release (public dist repo)
        if: env.DIST_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: ZahakJ/concord-dist
          token: ${{ env.DIST_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: |
            release-assets/*
            WINDOWS.md
          fail_on_unmatched_files: false
